# Copy to .github/workflows/patchpilot.yml in your repository.
# The "tests" job runs as usual; only when it fails does PatchPilot run and comment a proposed fix.
name: tests

on:
  pull_request:

permissions:
  contents: read
  pull-requests: write

jobs:
  tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: pip install pytest
      - run: python -m pytest -q

  patchpilot:
    needs: tests
    if: failure()
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: Tejaswiniprabhakaran/patchpilot/github_action@develop
        with:
          test-command: python -m pytest -rA -q -p no:cacheprovider

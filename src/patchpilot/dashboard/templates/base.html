<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>{% block title %}PatchPilot{% endblock %} · PatchPilot</title>
  <link rel="stylesheet" href="/static/style.css">
</head>
<body>
  <header class="top">
    <a class="brand" href="/">PatchPilot</a>
    <nav>
      <a href="/" {% if request.url.path == "/" %}aria-current="page"{% endif %}>Runs</a>
      <a href="/metrics" {% if request.url.path == "/metrics" %}aria-current="page"{% endif %}>Metrics</a>
      <a href="/try" {% if request.url.path == "/try" %}aria-current="page"{% endif %}>Try it</a>
    </nav>
  </header>
  <main>
    {% block content %}{% endblock %}
  </main>
  <footer class="muted">Every number on these pages is read from <code>results/</code> or <code>runs/</code>.</footer>
</body>
</html>

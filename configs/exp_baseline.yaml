# B0 — baseline: base Gemma 4 E4B, LLM-search localization, no retrieval, retries on (3 attempts).
# Answers RQ1 and is the reference for RQ2-RQ4. CPU scale: the model runs locally in Ollama and the
# evaluation set is QuixBugs (40) + a seeded 10-instance SWE-bench Lite subset (decisions D12).
id: B0
description: Base Gemma 4 E4B, LLM-search localization, no retrieval, 3 attempts
localizer: llm_search
llm:
  base_url: http://localhost:11434/v1
  model: gemma4:e4b
  temperature: 0.0
  seed: 42
  max_tokens: 2048
  context_tokens: 16384
  reasoning_effort: none  # decisions.md D10
agent:
  max_attempts: 3
  top_k_files: 3
benchmarks:
  - name: quixbugs
    instances: all
  - name: swebench-lite
    instances: subset10
seed: 42
